# ─── NETLIFY CONFIG ───────────────────────────────────────────────────────────

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"
  # Variáveis NEXT_PUBLIC_* são públicas por design — ignorar no secrets scanning
  SECRETS_SCAN_OMIT_KEYS  = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_WHATSAPP_NUMBER"
  SECRETS_SCAN_OMIT_PATHS = "SETUP-SUPABASE.md,.env.example"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Ignorar @opentelemetry/api (dependência indireta do @supabase/ssr)
[functions]
  external_node_modules = ["@opentelemetry/api"]

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
